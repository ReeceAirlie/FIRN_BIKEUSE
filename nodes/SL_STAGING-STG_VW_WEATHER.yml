              - columnCounter: "0"
                stepCounter: "0"
            transform: |-
              CASE 
              				 WHEN "VW_WEATHER"."TOT_SNOWFALL_CM" > 0  						 THEN 'Snow'
              				 WHEN "VW_WEATHER"."TOT_PRECIPITATION_MM" BETWEEN .1    AND 2.5  THEN 'Light Rain'
              			     WHEN "VW_WEATHER"."TOT_PRECIPITATION_MM" BETWEEN 2.5   AND 10   THEN 'Moderate Rain'
              			     WHEN "VW_WEATHER"."TOT_PRECIPITATION_MM" >       10   			 THEN 'Heavy Rain'				 
              				 WHEN "VW_WEATHER"."AVG_CLOUD_COVER_TOT_PCT" BETWEEN 0  AND 10   THEN  'Clear'
              			     WHEN "VW_WEATHER"."AVG_CLOUD_COVER_TOT_PCT" BETWEEN 10 AND 50   THEN  'Partly Cloudy'
              				 WHEN "VW_WEATHER"."AVG_CLOUD_COVER_TOT_PCT" BETWEEN 50 AND 90   THEN  'Mostly Cloudy'
              				 WHEN "VW_WEATHER"."AVG_CLOUD_COVER_TOT_PCT" BETWEEN 90 AND 100  THEN  'Overcast'
              	 END
